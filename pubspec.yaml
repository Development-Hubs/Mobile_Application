name: onesource_connect
description: OneSource Connect — the mobile companion of the OneSource ERP for staff, customers and workers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  package_info_plus: ^8.1.1
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  app_links: ^6.3.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_widget_from_html_core: ^0.15.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#8A1538'
  adaptive_icon_foreground: assets/brand/icon_foreground.png

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
