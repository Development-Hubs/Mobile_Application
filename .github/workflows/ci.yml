name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate host projects
        run: |
          flutter create --platforms=android,ios --org qa.onesource --project-name onesource_connect .
          rm -f test/widget_test.dart
          python3 tool/configure_platforms.py
      - run: flutter pub get
      - run: dart run tool/check_strings.dart
      - run: dart format --output=none --set-exit-if-changed --line-length 200 lib test
        continue-on-error: true
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create --platforms=android,ios --org qa.onesource --project-name onesource_connect .
          rm -f test/widget_test.dart
          python3 tool/configure_platforms.py
      - name: Debug APK against the demo agent ERP (unsigned, for testing only)
        run: flutter build apk --debug --dart-define-from-file=config/demoagent.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: onesource-connect-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create --platforms=android,ios --org qa.onesource --project-name onesource_connect .
          rm -f test/widget_test.dart
          python3 tool/configure_platforms.py
      - name: iOS build without signing (compile check only)
        run: flutter build ios --no-codesign --dart-define-from-file=config/demoagent.example.json
