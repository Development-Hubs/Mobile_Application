name: Release builds

# Manual: Actions → Release builds → Run workflow. Needs the secrets listed in docs/release.md.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      upload:
        description: Upload to Google Play / TestFlight
        default: false
        type: boolean

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Host projects, icons, platform settings
        run: |
          flutter create --platforms=android,ios --org qa.onesource --project-name onesource_connect .
          rm -f test/widget_test.dart
          python3 tool/configure_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build values (APP_CONFIG_JSON secret, else the production template)
        env: { APP_CONFIG_JSON: '${{ secrets.APP_CONFIG_JSON }}' }
        run: |
          if [ -n "$APP_CONFIG_JSON" ]; then printf '%s' "$APP_CONFIG_JSON" > config/release.local.json; else cp config/production.example.json config/release.local.json; fi
      - name: Upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-upload}" "$KEYSTORE_PASSWORD" > android/key.properties
      - run: flutter build appbundle --release --dart-define-from-file=config/release.local.json --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: onesource-connect-aab, path: build/app/outputs/bundle/release/app-release.aab }
      - name: Upload to Google Play
        if: ${{ inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: qa.onesource.onesource_connect
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: draft

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          flutter create --platforms=android,ios --org qa.onesource --project-name onesource_connect .
          rm -f test/widget_test.dart
          python3 tool/configure_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
      - env: { APP_CONFIG_JSON: '${{ secrets.APP_CONFIG_JSON }}' }
        run: |
          if [ -n "$APP_CONFIG_JSON" ]; then printf '%s' "$APP_CONFIG_JSON" > config/release.local.json; else cp config/production.example.json config/release.local.json; fi
      - name: Signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      - name: Provisioning profile and export options
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > profile.mobileprovision
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          name=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>qa.onesource.onesourceConnect</key><string>$name</string></dict>
          </dict></plist>
          PLIST
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$name\";/" ios/Runner.xcodeproj/project.pbxproj || true
      - run: flutter build ipa --release --dart-define-from-file=config/release.local.json --build-number=${{ github.run_number }} --export-options-plist=ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with: { name: onesource-connect-ipa, path: build/ios/ipa/*.ipa }
      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
